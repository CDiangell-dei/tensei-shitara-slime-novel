<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="slimeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Slime Body -->
  <path d="M50,15 C68,15 86,30 88,52 C90,72 78,85 50,85 C22,85 10,72 12,52 C14,30 32,15 50,15 Z" fill="url(#slimeGradient)" filter="url(#glow)"/>
  <!-- Top Highlights -->
  <ellipse cx="46" cy="28" rx="20" ry="8" fill="url(#shineGradient)" transform="rotate(-5 46 28)"/>
  <ellipse cx="72" cy="42" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(30 72 42)"/>
  <!-- Eyes -->
  <path d="M30,50 Q36,44 42,50" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M58,50 Q64,44 70,50" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Subtle blush -->
  <ellipse cx="26" cy="56" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="74" cy="56" rx="5" ry="3" fill="#f43f5e" opacity="0.4"/>
</svg>
